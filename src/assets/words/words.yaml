words:
  - word: smally
    part: adverb
    desc: In a small way.
    link: https://en.wiktionary.org/wiki/smally
    toMe: > 
      Smally is a word I discovered browsing the page, [English terms with rare senses](https://en.wiktionary.org/wiki/Category:English_terms_with_rare_senses). It’s not hard to see why *smally* is smally used. The combination of *-ly* suffix with the double L ending of *small* makes for an awkward derivation both in speech and print. But there’s something ineffable about *smally* that endears me to it greatly. Smally loved, smally spoken—*smally* charms me to no end.
  - word: tat
    part: noun
    desc: (uncountable, British) Cheap, tasteless, useless goods; trinkets.
    link:  https://en.wiktionary.org/wiki/tat#English
    toMe: >
      Tat is a word I’ve borrowed from British English after a childhood of watching YouTuber [Ashens](https://www.youtube.com/@ashens/videos) unbox cheap plastic toys, gizmos and gadgets. *Tat* joins a pantheon of similar words: knick-knack, trinket, tchotchke, bric-a-brac. But *tat* feels the most straight to the point. *Tat*. It feels closer to junk, crap, or shit. Stuff made to fill tips. *Tat.* 
  - word: nothingburger
    part: noun
    desc: Something of less importance than its treatment suggests
    link: https://en.wiktionary.org/wiki/nothingburger#English
    toMe: >
      Nothingburger is one of the Americanisms I have consciously integrated into my vocabulary. It’s just so completely weird, but also so sensical. Emptiness is better understood not by imagining nothing, but by imagining nothing between two burger buns. It makes the emptiness even larger. Like being naked except for a pair of shoes.