word:
  word: smally
  part: adverb
  desc: In a small way.
  link: https://en.wiktionary.org/wiki/smally
  toMe: |
    Smally is a word I discovered browsing the page, [English terms with rare senses](https://en.wiktionary.org/wiki/Category:English_terms_with_rare_senses). It’s not hard to see why *smally* is smally used. The combination of *-ly* suffix with the double L ending of *small* makes for an awkward derivation both in speech and print. But there’s something ineffable about *smally* that endears me to it greatly. Smally loved, smally spoken—*smally* charms me to no end.
  markdown: |
    <p>Smally is a word I discovered browsing the page, <a href="https://en.wiktionary.org/wiki/Category:English_terms_with_rare_senses">English terms with rare senses</a>. It’s not hard to see why <em>smally</em> is smally used. The combination of <em>-ly</em> suffix with the double L ending of <em>small</em> makes for an awkward derivation both in speech and print. But there’s something ineffable about <em>smally</em> that endears me to it greatly. Smally loved, smally spoken—<em>smally</em> charms me to no end.</p>
