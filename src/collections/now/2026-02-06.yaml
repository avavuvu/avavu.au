word:
  word: inevitabilism
  part: noun
  desc: The belief that certain developments are impossible to avoid; determinism.
  link: https://en.wiktionary.org/wiki/inevitabilism
  toMe: >
    Have you ever looked closely at a train's wheels? They are much larger and
    much more intricate than you might imagine from the heights of a station
    platform. If you have any humility, you might think, Thank god someone else
    built that, because I never could. It’s so tempting to look out at the
    world, and think that it is so complex and immense that there must have been
    some sort of plan. It must have been someone’s goal – 200 years ago – to
    create an iPad. But it wasn’t. We got iPads in the same way we got all of
    Darwin’s finches: time, luck, and natural selection. Super intelligent AI is
    not inevitable. And the belief that it is: Inevitablism. I am not an
    inevitabilist. Nor am I a doomer, pimp, luddite, or spruiker. I am a simple
    skeptic.
