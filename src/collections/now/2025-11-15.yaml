word:
  word: tat
  part: noun
  desc: (uncountable, British) Cheap, tasteless, useless goods; trinkets.
  link: https://en.wiktionary.org/wiki/tat#English
  toMe: >
    Tat is a word I’ve borrowed from British English after a childhood of
    watching YouTuber [Ashens](https://www.youtube.com/@ashens/videos) unbox
    cheap plastic toys, gizmos and gadgets. *Tat* joins a pantheon of similar
    words: knick-knack, trinket, tchotchke, bric-a-brac. But *tat* feels the
    most straight to the point. *Tat*. It's closer to junk, crap, or shit.
    Stuff made to fill tips. *Tat.* 
